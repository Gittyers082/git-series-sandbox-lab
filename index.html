<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Workshop – Student Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <header class="bg-slate-900 text-white py-6 px-4 shadow">
    <h1 class="text-2xl font-bold text-center">Git Workshop Student Directory</h1>
    <p class="text-center text-slate-300 mt-1">Every profile below is a Pull Request someone made.</p>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="status" class="text-center text-slate-500 mb-6">Loading profiles…</div>
    <div id="profile-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <footer class="text-center text-slate-400 text-sm py-6">
    git-workshop-practice — built for Git Series 1
  </footer>

  <script src="app.js"></script>
</body>
</html>
